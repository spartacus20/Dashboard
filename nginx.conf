server {
  listen 80;
  server_name _;

  # Definir root a nivel de servidor (CRÍTICO)
  root /usr/share/nginx/html;
  index index.html index.htm;

  location / {
    # Ya no necesitas 'root' aquí porque lo heredas del servidor
    try_files $uri $uri/ /index.html;
  }

  # Cacheo de archivos estáticos
  location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
    # Tampoco necesitas 'root' aquí, lo hereda del servidor
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}